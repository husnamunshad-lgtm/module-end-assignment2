<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>
<!-- custom css -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="signup-container my-5">
    <section class="signup-card">
        <h2>Create Account</h2>
        <p>Sign up to start your travel journey</p>
        <form id="signupForm">
            <!-- fullname -->
             <div class="mb-3">
             <label for="fullName" class="form-label">Full Name</label>
             <input type="text" id="fullName" placeholder="Enter your full name" class="form-control" >
             <small id="nameError"></small>
             </div>
             <!-- email -->
              <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control" placeholder="example@gmail.com">
              <small id="emailError"></small>
              </div>
              <!-- phone number -->
               <div class="mb-3">
               <label for="phoneNumber" class="form-label">Phone Number</label>
               <input type="tel" id="phoneNumber" class="form-control" placeholder="Enter 10 digit phone number">
               <small id="phoneError"></small>
               </div>
            
               <!-- location -->
                <div class="mb-3">
                <label for="city" class="form-label">City</label>
                <input type="text" id="city" class="form-control" placeholder="Enter your city">
                <small id="cityError"></small>
                </div>
                <!-- password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label> 
                   <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="Enter your password">
                   <button type="button" class="btn btn-outline-secondary toggle-password"
                    data-target="password">Show</button>
                    <small id="passwordError"></small>
                    </div>
                </div>
                <!-- confirm passsword -->
               <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm password</label>
                <div class="input-group">
                <input type="password" id="confirmPassword" class="form-control" placeholder="Recheck your password">
                <button type="button" class="btn btn-outline-secondary toggle-password"
                data-target="confirmPassword" >Show</button>
                <small id="confirmPasswordError"></small>
               </div>
               </div>
               <!-- button -->
                <button id="submitBtn" class="btn btn-primary">Sign Up</button>           
            </form>
            <!-- login -->
            <p class="login-link">Already have an account?
                <a href="./signIn.html">Sign In</a>
            </p>
    </section>
</main>
 <script src="./js/script.js"></script>

</body>

</html>
