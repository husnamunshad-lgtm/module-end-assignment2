<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <main class="signup-container my-5">

        <section class="signup-card">

            <h2>Welcome Back</h2>

            <p>Sign in to continue your travel journey</p>

            <form id="signinForm">

                <!-- Email -->
                <div class="mb-3">

                    <label for="signinEmail" class="form-label">
                        Email
                    </label>
                    <input
                        type="email"
                        id="signinEmail"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"

                    >

                    <small id="signinEmailError"></small>

                </div>


                <!-- Password -->
                <div class="mb-3">

                    <label for="signinPassword" class="form-label">
                        Password
                    </label>
                   <div class="input-group">
   
                    <input
                        type="password"
                        id="signinPassword"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                    <button type="button" class="btn btn-outline-secondary toggle-password"
                    data-target="signinPassword">Show</button>

                    <small id="signinPasswordError"></small>
                   </div>

                </div>


                <!-- Sign In button -->
                <button
                    type="submit"
                    id="signinBtn"
                    class="btn btn-primary w-100">
                    Sign In
                </button>

            </form>


            <!-- Sign Up link -->
            <p class="login-link">

                Don't have an account?

                <a href="./SignUp.html">Sign Up</a>

            </p>

        </section>

    </main>

    <script src="./js/script.js"></script>

</body>

</html>
